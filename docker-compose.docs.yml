services:
  docs:
    image: drf_task_local_docs
    container_name: drf_task_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./drf_task:/app/drf_task:z
    ports:
      - '9000:9000'
    command: /start-docs
